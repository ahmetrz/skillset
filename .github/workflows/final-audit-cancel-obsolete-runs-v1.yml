name: Cancel obsolete audit runs v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-cancel-obsolete-runs-v1.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete rows-api repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 33877997224 --repo ${{ github.repository }} || true
          gh run cancel 33888780009 --repo ${{ github.repository }} || true
