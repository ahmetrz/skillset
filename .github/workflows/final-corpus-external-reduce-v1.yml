name: Final corpus external reduce v1

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/final-corpus-external-reduce-v1.yml'
      - 'scripts/final-audit-reduce-v1.mjs'
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'

permissions:
  contents: write

concurrency:
  group: final-corpus-external-reduce-v1
  cancel-in-progress: true

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
  B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3
      - run: node scripts/final-audit-reduce-v1.mjs
      - name: Persist reducer outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-audit-reduce-status.json
          if [ -f audit/conflict-registry-preliminary.json ]; then
            git add audit/conflict-registry-preliminary.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update final audit reducer state"
          git push origin HEAD:gitskills-migration-run
