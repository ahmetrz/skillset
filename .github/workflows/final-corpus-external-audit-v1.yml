name: Final corpus external audit v1

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/final-corpus-external-audit-v1.yml'
      - 'scripts/final-audit-external-v1.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: final-corpus-external-audit-v1
  cancel-in-progress: false

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
  B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

jobs:
  smoke:
    name: Smoke ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: git-legacy
            parts: 19132
          - source: git-b2
            parts: 100000
          - source: skills-b2
            parts: 100000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3
      - name: Run one-unit smoke
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          AUDIT_PARTITION: '0'
          AUDIT_PARTITIONS: ${{ matrix.parts }}
        run: node scripts/final-audit-external-v1.mjs

  ingest:
    name: Audit ${{ matrix.source }} ${{ matrix.partition }}/${{ matrix.parts }}
    needs: smoke
    if: ${{ needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {source: git-legacy, partition: 0, parts: 8}
          - {source: git-legacy, partition: 1, parts: 8}
          - {source: git-legacy, partition: 2, parts: 8}
          - {source: git-legacy, partition: 3, parts: 8}
          - {source: git-legacy, partition: 4, parts: 8}
          - {source: git-legacy, partition: 5, parts: 8}
          - {source: git-legacy, partition: 6, parts: 8}
          - {source: git-legacy, partition: 7, parts: 8}
          - {source: git-b2, partition: 0, parts: 4}
          - {source: git-b2, partition: 1, parts: 4}
          - {source: git-b2, partition: 2, parts: 4}
          - {source: git-b2, partition: 3, parts: 4}
          - {source: skills-b2, partition: 0, parts: 4}
          - {source: skills-b2, partition: 1, parts: 4}
          - {source: skills-b2, partition: 2, parts: 4}
          - {source: skills-b2, partition: 3, parts: 4}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3
      - name: Run checkpointed audit partition
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          AUDIT_PARTITION: ${{ matrix.partition }}
          AUDIT_PARTITIONS: ${{ matrix.parts }}
        run: node scripts/final-audit-external-v1.mjs

  status:
    name: Persist audit checkpoint
    needs: [smoke, ingest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3
      - run: node scripts/final-audit-external-v1.mjs --status
      - name: Persist status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-audit-ingest-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update final audit ingest status"
          git push origin HEAD:gitskills-migration-run
