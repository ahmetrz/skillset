name: skills.sh exact turbo

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/skills-sh-exact-turbo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-exact-turbo-v1
  cancel-in-progress: true

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: archive-1, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-2, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-3, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-4, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-5, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-6, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-7, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: archive-8, endpoint: skills-sh-storage-archive-v1, calls: 500 }
          - { lane: normalize-1, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-2, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-3, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-4, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-5, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-6, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-7, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
          - { lane: normalize-8, endpoint: skills-sh-eval-normalize-v1, calls: 700 }
    steps:
      - name: Drain exact-content stage
        shell: bash
        env:
          ENDPOINT: ${{ matrix.endpoint }}
          MAX_CALLS: ${{ matrix.calls }}
        run: |
          set -euo pipefail
          empty=0; failures=0; successes=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body=$(mktemp)
            code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/$ENDPOINT" || true)
            text=$(cat "$body" 2>/dev/null || true); rm -f "$body"
            echo "[${{ matrix.lane }}][$i] HTTP $code ${text:0:420}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then
              failures=0
              if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empty=$((empty+1)); (( empty>=4 )) && break; else empty=0; successes=$((successes+1)); fi
            else
              failures=$((failures+1)); (( failures>=6 )) && exit 1; sleep $((failures*2))
            fi
            sleep 0.25
          done
          echo "lane=${{ matrix.lane }} successes=$successes"
