name: skills.sh checkpointed fast finish

on:
  workflow_dispatch:
  push:
    branches: [gitskills-migration-run]
    paths: [.github/workflows/skills-sh-fast-finish.yml]
  schedule:
    # Each run is bounded below three hours and resumes from durable checkpoints.
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: skills-sh-checkpointed-fast-finish-v1
  cancel-in-progress: false

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1
  REST: https://cxvvfgwdqgxczxmomztw.supabase.co/rest/v1/rpc
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_-QoeR1QT-TcMoLNxrHmNNg_pniY7P7r

jobs:
  archive-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix: { lane: [1,2,3,4,5,6] }
    steps:
      - name: Recover and drain stale exact-content archive buckets
        shell: bash
        run: |
          set -euo pipefail
          empty=0; failures=0
          for ((i=1;i<=900;i++)); do
            body=$(mktemp)
            code=$(curl -sS --connect-timeout 8 --max-time 90 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-storage-archive-v1" || true)
            text=$(head -c 800 "$body" 2>/dev/null || true); rm -f "$body"
            echo "archive lane=${{ matrix.lane }} round=$i http=$code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then
              failures=0
              if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empty=$((empty+1)); (( empty>=3 )) && break; else empty=0; fi
            else
              failures=$((failures+1)); (( failures>=5 )) && exit 1
              delay=$((failures*2)); (( delay>12 )) && delay=12; sleep "$delay"
            fi
            sleep 0.2
          done

  normalize:
    needs: archive-tail
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix: { lane: [1,2,3,4,5,6] }
    steps:
      - name: Normalize newly archived exact content
        shell: bash
        run: |
          set -euo pipefail
          empty=0; failures=0
          for ((i=1;i<=1800;i++)); do
            body=$(mktemp)
            code=$(curl -sS --connect-timeout 8 --max-time 60 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-eval-normalize-v1" || true)
            text=$(head -c 800 "$body" 2>/dev/null || true); rm -f "$body"
            echo "normalize lane=${{ matrix.lane }} round=$i http=$code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then
              failures=0
              if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empty=$((empty+1)); (( empty>=3 )) && break; else empty=0; fi
            else
              failures=$((failures+1)); (( failures>=5 )) && exit 1
              delay=$((failures*2)); (( delay>12 )) && delay=12; sleep "$delay"
            fi
            sleep 0.15
          done

  projection:
    needs: normalize
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - name: Drive sanitized projection through its DB-governed capacity gate
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json')
          quiet=0
          for ((i=1;i<=5000;i++)); do
            body=$(curl -fsS --connect-timeout 8 --max-time 40 -X POST "${headers[@]}" -d '{}' "$REST/skillset_sdlc_projection_v5_tick_v1")
            state=$(jq -c 'if type=="array" then .[0] else . end' <<<"$body")
            echo "projection controller round=$i state=$state"
            pending=$(jq -r '.pending // 0' <<<"$state"); processing=$(jq -r '.processing // 0' <<<"$state"); queued=$(jq -r '.http_queued // 0' <<<"$state")
            if (( pending==0 && processing==0 && queued==0 )); then quiet=$((quiet+1)); else quiet=0; fi
            (( quiet>=3 )) && break
            sleep 2
          done
          (( quiet>=3 )) || { echo "Projection controller time budget exhausted; next checkpoint run will resume."; exit 0; }

  evaluation:
    needs: projection
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - name: Evaluate all new global content-hash representatives in bounded deltas
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json')
          deadline=$((SECONDS+9500))
          completed=0
          while (( SECONDS < deadline )); do
            start=$(curl -fsS --connect-timeout 8 --max-time 60 -X POST "${headers[@]}" -d '{"p_limit":5000}' "$REST/skillset_eval_v31_canonical_start_delta")
            run=$(jq -r 'if type=="array" and length>0 then .[0].run_id // empty else empty end' <<<"$start")
            if [[ -z "$run" ]]; then
              echo "No unevaluated canonical representatives remain."
              break
            fi
            echo "evaluation delta run=$run"
            while (( SECONDS < deadline )); do
              tick=$(curl -fsS --connect-timeout 8 --max-time 40 -X POST "${headers[@]}" -d '{}' "$REST/skillset_eval_v31_canonical_tick")
              state=$(jq -c 'if type=="array" then .[0] else . end' <<<"$tick")
              echo "evaluation state=$state"
              done=$(jq -r '.complete_checked // false' <<<"$state")
              [[ "$done" == true ]] && { completed=$((completed+1)); break; }
              sleep 2
            done
          done
          echo "completed_delta_runs=$completed"
          # Timeout is a checkpoint, not data loss. The scheduled successor resumes.
