name: Verify skills.sh cached snapshot controls v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-cache-control-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: final-audit-v4-turbo

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest selective-repair feature controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf controls
          mkdir -p controls
          gh release download "$RELEASE_TAG" --dir controls --pattern 'features-skills-b2-p*-of-04.ndjson.gz'
      - name: Compare acquisition hashes to skills.sh cache
        continue-on-error: true
        env:
          CONTROL_DIR: controls
          CONTROL_OUT: skills-cache-control-v6.json
        run: node scripts/final-audit-skills-cache-control-v6.mjs
      - name: Publish control report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" skills-cache-control-v6.json --clobber