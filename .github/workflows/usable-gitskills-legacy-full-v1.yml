name: Usable skillset GitSkills legacy full reconstruction v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usable-gitskills-legacy-full-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usable-gitskills-legacy-full-v1
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with: {ref: gitskills-migration-run}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check --no-cache-dir pyarrow fsspec requests aiohttp
      - name: Extract assigned legacy range from HF parquet
        env:
          LEGACY_PARTITION: ${{ matrix.partition }}
          LEGACY_PARTITIONS: '8'
          LEGACY_OUT_DIR: usable-gitskills-legacy
        run: python scripts/usable-gitskills-legacy-full-extract-v1.py
      - name: Build complete legacy feature shard
        env:
          LEGACY_PARTITION: ${{ matrix.partition }}
          LEGACY_PARTITIONS: '8'
          LEGACY_OUT_DIR: usable-gitskills-legacy
        run: node scripts/usable-gitskills-legacy-full-transform-v1.mjs
      - name: Remove raw source cache
        if: always()
        run: rm -f usable-gitskills-legacy/raw-*.ndjson.gz
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: usable-gitskills-legacy-full-${{ matrix.partition }}
          path: |
            usable-gitskills-legacy/features-*.ndjson.gz
            usable-gitskills-legacy/manifest-*.json
          if-no-files-found: error
          compression-level: 0

  reduce:
    needs: bulk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with: {ref: gitskills-migration-run}
      - uses: actions/download-artifact@v4
        with:
          pattern: usable-gitskills-legacy-full-*
          path: gitskills-legacy-full
          merge-multiple: true
      - name: Prove full legacy range
        env:
          LEGACY_FULL_DIR: gitskills-legacy-full
          LEGACY_GATE_OUT: audit/usable-gitskills-legacy-full-gate.json
        run: node scripts/usable-gitskills-legacy-full-reduce-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: usable-gitskills-legacy-full-features-v1
          path: gitskills-legacy-full/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Persist gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s audit/usable-gitskills-legacy-full-gate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/usable-gitskills-legacy-full-gate.json
          git commit -m "audit: persist full GitSkills legacy reconstruction gate" || exit 0
          git pull --rebase origin gitskills-migration-run
          git push origin HEAD:gitskills-migration-run
