name: GitSkills B2 migration

on:
  push:
    branches:
      - gitskills-migration-run
    paths:
      - 'scripts/gitskills-b2-worker-v2.mjs'
      - '.github/workflows/gitskills-b2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gitskills-b2-migration-v3
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @aws-sdk/client-s3@3
      - name: Recover cancelled and HF-429 shards
        run: node scripts/gitskills-b2-worker-v2.mjs --recover

  migrate:
    needs: recover
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      GITSKILLS_PACK_SIZE: '32'
      GITSKILLS_FETCH_CONCURRENCY: '4'
      GITSKILLS_PACKS_PER_RUN: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN B2_ACCESS_KEY_ID B2_SECRET_ACCESS_KEY B2_BUCKET B2_ENDPOINT; do
            test -n "${!v:-}" || { echo "Missing $v"; exit 1; }
          done
      - name: Install bounded worker dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @aws-sdk/client-s3@3
      - name: Run migration worker ${{ matrix.worker }}
        run: node scripts/gitskills-b2-worker-v2.mjs
      - name: Print Turso checkpoint
        if: always()
        run: node scripts/gitskills-b2-worker-v2.mjs --status

  continue-if-needed:
    needs: migrate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Decide whether more exact-content work remains
        id: remain
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { createClient } from '@libsql/client';
          const c=createClient({url:process.env.TURSO_DATABASE_URL,authToken:process.env.TURSO_AUTH_TOKEN});
          const r=await c.execute(`SELECT COUNT(*) AS n FROM gitskills_shards WHERE status<>'done' AND attempts<64`);
          const n=Number(r.rows[0]?.n||0);
          console.log(`remaining=${n}`);
          console.error(JSON.stringify({event:'remaining',n}));
          NODE
      - name: Chain next migration run
        if: steps.remain.outputs.remaining != '0'
        run: gh workflow run gitskills-b2-smoke.yml --ref gitskills-migration-run
