name: Skillset Quality Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quality-gate.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run quality batch
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            'https://elnsqdpbxjcrudvwdzbs.supabase.co/functions/v1/skillset-quality-gate?limit=20'
