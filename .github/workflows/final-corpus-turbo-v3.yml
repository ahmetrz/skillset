name: Final corpus turbo audit v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-corpus-turbo-v3
  cancel-in-progress: false

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
  B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
  AUDIT_B2_READ: '0'

jobs:
  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {source: git-b2, partition: 0, parts: 4}
          - {source: git-b2, partition: 1, parts: 4}
          - {source: git-b2, partition: 2, parts: 4}
          - {source: git-b2, partition: 3, parts: 4}
          - {source: skills-b2, partition: 0, parts: 16}
          - {source: skills-b2, partition: 1, parts: 16}
          - {source: skills-b2, partition: 2, parts: 16}
          - {source: skills-b2, partition: 3, parts: 16}
          - {source: skills-b2, partition: 4, parts: 16}
          - {source: skills-b2, partition: 5, parts: 16}
          - {source: skills-b2, partition: 6, parts: 16}
          - {source: skills-b2, partition: 7, parts: 16}
          - {source: skills-b2, partition: 8, parts: 16}
          - {source: skills-b2, partition: 9, parts: 16}
          - {source: skills-b2, partition: 10, parts: 16}
          - {source: skills-b2, partition: 11, parts: 16}
          - {source: skills-b2, partition: 12, parts: 16}
          - {source: skills-b2, partition: 13, parts: 16}
          - {source: skills-b2, partition: 14, parts: 16}
          - {source: skills-b2, partition: 15, parts: 16}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3 tar-stream
      - name: Run single-read turbo partition
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          AUDIT_PARTITION: ${{ matrix.partition }}
          AUDIT_PARTITIONS: ${{ matrix.parts }}
        run: node scripts/final-audit-external-v1.mjs

  checkpoint:
    needs: turbo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3 tar-stream
      - name: Refresh audit checkpoints
        env:
          AUDIT_B2_READ: '0'
        run: |
          node scripts/final-audit-external-v1.mjs --status
          node scripts/final-audit-reduce-v1.mjs
      - name: Persist checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-audit-ingest-status.json audit/final-audit-reduce-status.json
          if [ -f audit/conflict-registry-preliminary.json ]; then git add audit/conflict-registry-preliminary.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update turbo final audit checkpoints"
          git push origin HEAD:gitskills-migration-run
