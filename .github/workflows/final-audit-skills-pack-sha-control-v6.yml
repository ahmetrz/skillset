name: Final audit skills.sh pack SHA rescue v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-pack-sha-control-v6.yml'
  workflow_dispatch:

concurrency:
  group: final-audit-skills-pack-sha-rescue-v7
  cancel-in-progress: true

permissions:
  contents: write

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  RELEASE_TAG: final-audit-v4-turbo

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { source: 'raaptechllc/raaptech', label: 'raaptech' }
          - { source: 'willa-code/wstack', label: 'wstack' }
          - { source: 'tolgazorlu/stellar-agents', label: 'stellar' }
          - { source: 'youlfey/enterprise-skills', label: 'enterprise' }
          - { source: 'zoharvan12/kolbo-code', label: 'kolbo' }
          - { source: 'syncrescendence/syncrescendence', label: 'syncrescendence' }
          - { source: 'k-park/ks-dev-proc', label: 'ksdev' }
          - { source: 'iamzhihuix/droid-account-manage', label: 'droid' }
          - { source: 'dunksmaster/tokendc', label: 'tokendc' }
          - { source: 'spartypkp/claude-os-public', label: 'claudeos' }
          - { source: 'reyanda/dodexa', label: 'dodexa' }
          - { source: 'wibaek/personal-skills', label: 'personal' }
          - { source: 'staractive/courses-workshop-plugins', label: 'courses' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client
      - name: Download current source manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf tail-manifests pack-sha-rescue-out
          mkdir -p tail-manifests pack-sha-rescue-out
          gh release download "$RELEASE_TAG" --dir tail-manifests --pattern 'manifest-*' || true
      - name: Reconstruct and verify exact acquisition packs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_DIR: tail-manifests
          RESCUE_OUT: pack-sha-rescue-out
          AUDIT_PARTITION: '0'
          AUDIT_PARTITIONS: '1'
          RESCUE_LABEL: ${{ github.run_id }}-${{ matrix.label }}
          RESCUE_SOURCE: ${{ matrix.source }}
          RESCUE_FAST: '1'
        run: node scripts/final-audit-skills-pack-sha-rescue-v7.mjs
      - name: Publish verified feature and provenance shards
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" pack-sha-rescue-out/* --clobber
# source-isolated fast lane v7.6