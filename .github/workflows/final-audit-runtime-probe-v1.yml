name: Final audit runtime probe v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-audit-runtime-probe-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
  B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
  AUDIT_B2_READ: '0'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3 tar-stream
      - name: Probe one GitSkills pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit
          set +e
          AUDIT_SOURCE=git-b2 AUDIT_PARTITION=0 AUDIT_PARTITIONS=100000 node scripts/final-audit-external-v1.mjs > audit/final-audit-runtime-probe.log 2>&1
          code=$?
          msg=$(grep -m1 -E "^[A-Za-z]*Error:|LibsqlError:|SQLITE_|SQL_PARSE|no such table|no such column|URL_INVALID|SERVER_ERROR" audit/final-audit-runtime-probe.log | tr -s ' ' | cut -c1-130)
          [ -z "$msg" ] && msg=$(head -n 1 audit/final-audit-runtime-probe.log | tr -s ' ' | cut -c1-130)
          [ -z "$msg" ] && msg="exit=$code"
          state=success
          [ "$code" -ne 0 ] && state=error
          curl -sS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             -d "$(jq -nc --arg state "$state" --arg desc "$msg" '{state:$state,context:"runtime-probe",description:$desc}')" >/dev/null
          cat audit/final-audit-runtime-probe.log
          exit 0
