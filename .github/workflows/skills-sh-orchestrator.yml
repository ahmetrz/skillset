name: skills.sh orchestrator

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/skills-sh-orchestrator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-orchestrator-v2
  cancel-in-progress: true

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1

jobs:
  d3-segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4,5,6]
    steps:
      - name: Drain D3 segments
        env: { ENDPOINT: skills-sh-lexical-d3-segment-v1, MAX_CALLS: '8', SLEEP_S: '1' }
        run: |
          set -euo pipefail
          empties=0; failures=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body=$(mktemp); code=$(curl -sS --connect-timeout 8 --max-time 60 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/$ENDPOINT" || true); text=$(cat "$body" 2>/dev/null || true); rm -f "$body"
            echo "[segment lane=${{ matrix.lane }}][$i] HTTP $code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then failures=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empties=$((empties+1)); (( empties>=2 )) && break; else empties=0; fi; else failures=$((failures+1)); (( failures>=4 )) && exit 1; sleep $((failures*2)); fi
            sleep "$SLEEP_S"
          done

  d3-reduce:
    needs: d3-segment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4,5,6,7,8]
    steps:
      - name: Drain D3 reducers
        env: { ENDPOINT: skills-sh-lexical-d3-reduce-v1, MAX_CALLS: '10', SLEEP_S: '1' }
        run: |
          set -euo pipefail
          empties=0; failures=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body=$(mktemp); code=$(curl -sS --connect-timeout 8 --max-time 75 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/$ENDPOINT" || true); text=$(cat "$body" 2>/dev/null || true); rm -f "$body"
            echo "[reduce lane=${{ matrix.lane }}][$i] HTTP $code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then failures=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empties=$((empties+1)); (( empties>=2 )) && break; else empties=0; fi; else failures=$((failures+1)); (( failures>=4 )) && exit 1; sleep $((failures*2)); fi
            sleep "$SLEEP_S"
          done

  combined-v2:
    needs: d3-reduce
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4,5,6,7,8]
    steps:
      - name: Drain combined-v2 reducers
        env: { ENDPOINT: skills-sh-combined-v2-reduce-v1, MAX_CALLS: '10', SLEEP_S: '1' }
        run: |
          set -euo pipefail
          empties=0; failures=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body=$(mktemp); code=$(curl -sS --connect-timeout 8 --max-time 90 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/$ENDPOINT" || true); text=$(cat "$body" 2>/dev/null || true); rm -f "$body"
            echo "[combined lane=${{ matrix.lane }}][$i] HTTP $code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then failures=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empties=$((empties+1)); (( empties>=2 )) && break; else empties=0; fi; else failures=$((failures+1)); (( failures>=4 )) && exit 1; sleep $((failures*2)); fi
            sleep "$SLEEP_S"
          done

  existing-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: repo-scan-1, endpoint: skillset-skills-sh-repo-scan-v1, max_calls: 240, sleep_s: 2 }
          - { stage: repo-scan-2, endpoint: skillset-skills-sh-repo-scan-v1, max_calls: 240, sleep_s: 2 }
          - { stage: repo-scan-3, endpoint: skillset-skills-sh-repo-scan-v1, max_calls: 240, sleep_s: 2 }
          - { stage: repo-scan-4, endpoint: skillset-skills-sh-repo-scan-v1, max_calls: 240, sleep_s: 2 }
          - { stage: archive-1, endpoint: skills-sh-storage-archive-v1, max_calls: 240, sleep_s: 2 }
          - { stage: archive-2, endpoint: skills-sh-storage-archive-v1, max_calls: 240, sleep_s: 2 }
          - { stage: archive-3, endpoint: skills-sh-storage-archive-v1, max_calls: 240, sleep_s: 2 }
          - { stage: archive-4, endpoint: skills-sh-storage-archive-v1, max_calls: 240, sleep_s: 2 }
          - { stage: normalize-1, endpoint: skills-sh-eval-normalize-v1, max_calls: 360, sleep_s: 1 }
          - { stage: normalize-2, endpoint: skills-sh-eval-normalize-v1, max_calls: 360, sleep_s: 1 }
          - { stage: normalize-3, endpoint: skills-sh-eval-normalize-v1, max_calls: 360, sleep_s: 1 }
          - { stage: normalize-4, endpoint: skills-sh-eval-normalize-v1, max_calls: 360, sleep_s: 1 }
    steps:
      - name: Drive ${{ matrix.stage }}
        env:
          ENDPOINT: ${{ matrix.endpoint }}
          MAX_CALLS: ${{ matrix.max_calls }}
          SLEEP_S: ${{ matrix.sleep_s }}
        run: |
          set -euo pipefail
          empties=0; failures=0; successes=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body=$(mktemp); code=$(curl -sS --connect-timeout 8 --max-time 50 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/$ENDPOINT" || true); text=$(cat "$body" 2>/dev/null || true); rm -f "$body"
            echo "[${{ matrix.stage }}][$i] HTTP $code ${text:0:500}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then failures=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then empties=$((empties+1)); (( empties>=3 )) && break; else empties=0; successes=$((successes+1)); fi; else failures=$((failures+1)); (( failures>=5 )) && exit 1; sleep $((failures*2)); fi
            sleep "$SLEEP_S"
          done
          echo "stage=${{ matrix.stage }} successes=$successes"
