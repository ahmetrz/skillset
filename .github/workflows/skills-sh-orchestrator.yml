name: skills.sh orchestrator

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/skills-sh-orchestrator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-orchestrator-v1
  cancel-in-progress: false

jobs:
  run-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: d3
            endpoint: skills-sh-lexical-d3-v1
            max_calls: 180
            sleep_s: 2
          - stage: repo-scan
            endpoint: skillset-skills-sh-repo-scan-v1
            max_calls: 180
            sleep_s: 3
          - stage: archive
            endpoint: skills-sh-storage-archive-v1
            max_calls: 180
            sleep_s: 3
          - stage: normalize
            endpoint: skills-sh-eval-normalize-v1
            max_calls: 300
            sleep_s: 2
    steps:
      - name: Drive ${{ matrix.stage }} safely
        shell: bash
        env:
          ENDPOINT: ${{ matrix.endpoint }}
          MAX_CALLS: ${{ matrix.max_calls }}
          SLEEP_S: ${{ matrix.sleep_s }}
        run: |
          set -euo pipefail
          base='https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1'
          successes=0
          empties=0
          failures=0
          for ((i=1;i<=MAX_CALLS;i++)); do
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 40 -o "$body" -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{}' "$base/$ENDPOINT" || true)"
            text="$(cat "$body" 2>/dev/null || true)"
            rm -f "$body"
            echo "[$ENDPOINT][$i] HTTP $code ${text:0:600}"
            if [[ "$code" == 200 || "$code" == 201 ]]; then
              if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$text"; then
                empties=$((empties+1))
                if (( empties >= 3 )); then
                  echo "stage appears drained after $i calls"
                  break
                fi
              else
                empties=0
                successes=$((successes+1))
              fi
              failures=0
            else
              failures=$((failures+1))
              if (( failures >= 5 )); then
                echo "fail-closed: five consecutive HTTP failures" >&2
                exit 1
              fi
              sleep 5
            fi
            sleep "$SLEEP_S"
          done
          echo "stage=$ENDPOINT successes=$successes empties=$empties"
