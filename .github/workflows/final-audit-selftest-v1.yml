name: Final audit selftest v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-selftest-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3 tar-stream
      - name: Run syntax and import checks
        shell: bash
        run: |
          mkdir -p audit
          set +e
          {
            echo "=== external syntax ==="
            node --check scripts/final-audit-external-v1.mjs
            echo "exit=$?"
            echo "=== policy helper syntax ==="
            node --check scripts/final-audit-policy-helper-v1.mjs
            echo "exit=$?"
            echo "=== fallback syntax ==="
            node --check scripts/final-audit-source-fallback-v1.mjs
            echo "exit=$?"
            echo "=== policy helper import ==="
            node -e "import('./scripts/final-audit-policy-helper-v1.mjs').then(()=>console.log('ok')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
            echo "exit=$?"
            echo "=== fallback import ==="
            node -e "import('./scripts/final-audit-source-fallback-v1.mjs').then(()=>console.log('ok')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
            echo "exit=$?"
          } > audit/final-audit-selftest.log 2>&1
          cat audit/final-audit-selftest.log
      - name: Persist selftest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-audit-selftest.log
          git commit -m "chore: persist final audit selftest" || exit 0
          git push origin HEAD:gitskills-migration-run
