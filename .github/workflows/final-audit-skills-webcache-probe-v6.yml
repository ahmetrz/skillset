name: Probe skills.sh webcache internals v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-webcache-probe-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/final-audit-skills-webcache-probe-v6.mjs
