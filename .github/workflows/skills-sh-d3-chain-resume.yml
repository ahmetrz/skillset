name: skills.sh D3 chain resume

on:
  push:
    branches: [gitskills-migration-run]
    paths: ['.github/workflows/skills-sh-d3-chain-resume.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4,5,6] } }
    steps:
      - name: segment
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..8}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 60 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-lexical-d3-segment-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=2))&&break; else e=0; fi; else f=$((f+1)); ((f>=4))&&exit 1; sleep $((f*2)); fi; sleep 1; done
  reduce:
    needs: segment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4,5,6,7,8] } }
    steps:
      - name: reduce
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..10}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 75 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-lexical-d3-reduce-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=2))&&break; else e=0; fi; else f=$((f+1)); ((f>=4))&&exit 1; sleep $((f*2)); fi; sleep 1; done
  combined:
    needs: reduce
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4,5,6,7,8] } }
    steps:
      - name: combined
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..10}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 90 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-combined-v2-reduce-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=2))&&break; else e=0; fi; else f=$((f+1)); ((f>=4))&&exit 1; sleep $((f*2)); fi; sleep 1; done
  repo2:
    needs: combined
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4,5,6,7,8] } }
    steps:
      - name: second-pass repo reduce
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..10}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 90 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-combined-v2-repo-reduce-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=2))&&break; else e=0; fi; else f=$((f+1)); ((f>=4))&&exit 1; sleep $((f*2)); fi; sleep 1; done
  archive:
    needs: repo2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4] } }
    steps:
      - name: exact archive
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..900}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 55 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-d3-archive-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=3))&&break; else e=0; fi; else f=$((f+1)); ((f>=5))&&exit 1; sleep $((f*2)); fi; sleep 1; done
  normalize:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { lane: [1,2,3,4] } }
    steps:
      - name: normalize exact archive
        run: |
          set -euo pipefail; e=0; f=0
          for i in {1..900}; do b=$(mktemp); c=$(curl -sS --connect-timeout 8 --max-time 50 -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/skills-sh-eval-normalize-v1" || true); t=$(cat "$b"||true); rm -f "$b"; echo "[$i] $c ${t:0:500}"; if [[ "$c" == 200 || "$c" == 201 ]]; then f=0; if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$t"; then e=$((e+1)); ((e>=3))&&break; else e=0; fi; else f=$((f+1)); ((f>=5))&&exit 1; sleep $((f*2)); fi; sleep 1; done
