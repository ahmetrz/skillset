name: Final audit skills.sh exact B2 rescue v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-b2-exact-rescue-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
  B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
  B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  RELEASE_TAG: final-audit-v4-turbo

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { source: 'raaptechllc/raaptech', label: 'raaptech' }
          - { source: 'willa-code/wstack', label: 'wstack' }
          - { source: 'tolgazorlu/stellar-agents', label: 'stellar' }
          - { source: 'youlfey/enterprise-skills', label: 'enterprise' }
          - { source: 'zoharvan12/kolbo-code', label: 'kolbo' }
          - { source: 'syncrescendence/syncrescendence', label: 'syncrescendence' }
          - { source: 'k-park/ks-dev-proc', label: 'ksdev' }
          - { source: 'iamzhihuix/droid-account-manage', label: 'droid' }
          - { source: 'dunksmaster/tokendc', label: 'tokendc' }
          - { source: 'spartypkp/claude-os-public', label: 'claudeos' }
          - { source: 'reyanda/dodexa', label: 'dodexa' }
          - { source: 'wibaek/personal-skills', label: 'personal' }
          - { source: 'staractive/courses-workshop-plugins', label: 'courses' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @libsql/client @aws-sdk/client-s3
      - name: Prepare isolated output
        run: |
          rm -rf rescue-skip rescue-out
          mkdir -p rescue-skip rescue-out
      - name: Recover unresolved exact skills.sh packs from B2
        continue-on-error: true
        env:
          AUDIT_PARTITION: '0'
          AUDIT_PARTITIONS: '1'
          AUDIT_SKIP_MANIFEST_DIR: rescue-skip
          AUDIT_OUT_DIR: rescue-out
          RESCUE_SOURCE: ${{ matrix.source }}
          RESCUE_LABEL: ${{ github.run_id }}-${{ matrix.label }}
        run: node scripts/final-audit-skills-b2-exact-rescue-v6.mjs
      - name: Handoff exact rescue output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-tail-${{ matrix.label }}
          path: rescue-out/*
          if-no-files-found: error
          compression-level: 0

  collect:
    needs: rescue
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gitskills-migration-run
      - name: Reset persisted tail assets
        run: |
          rm -rf audit/b2-tail-assets
          mkdir -p audit/b2-tail-assets
      - name: Collect all source-isolated rescue outputs
        uses: actions/download-artifact@v4
        with:
          pattern: b2-tail-*
          path: audit/b2-tail-assets
          merge-multiple: true
      - name: Validate collected tail assets
        run: |
          test "$(find audit/b2-tail-assets -name 'manifest-*.json' | wc -l)" -ge 13
          test "$(find audit/b2-tail-assets -name 'features-*.ndjson.gz' | wc -l)" -ge 13
      - name: Persist exact tail assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audit/b2-tail-assets
          git commit -m "chore: persist exact skills.sh B2 tail rescue" || exit 0
          git pull --rebase origin gitskills-migration-run
          git push origin HEAD:gitskills-migration-run
