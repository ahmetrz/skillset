name: Probe skills.sh detail payload v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-detail-probe-v6.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect detail payload
        run: |
          set -e
          for url in \
            https://skills.sh/facukoren/pm-agent/pm-workflow \
            https://skills.sh/k-park/ks-dev-proc/fix-root-cause \
            https://skills.sh/zoharvan12/kolbo-code/video-prompting-guide
          do
            echo "=== $url ==="
            curl -L -sS "$url" -o /tmp/page
            echo "bytes=$(wc -c </tmp/page)"
            python -c 'import re; s=open("/tmp/page","r",encoding="utf-8",errors="replace").read(); print({n:s.find(n) for n in ["SKILL.md","contents","self.__next_f.push","---","name:"]}); m=re.search(r"SKILL\\.md",s); print(s[max(0,m.start()-1200):min(len(s),m.start()+6000)] if m else "NO_SKILL_MD_MARKER")'
          done
