name: Probe skills.sh detail payload v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-skills-detail-probe-v6.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect detail payload
        run: |
          set -e
          for url in \
            https://skills.sh/facukoren/pm-agent/pm-workflow \
            https://skills.sh/k-park/ks-dev-proc/fix-root-cause \
            https://skills.sh/zoharvan12/kolbo-code/video-prompting-guide
          do
            echo "=== $url ==="
            curl -L -sS "$url" -o /tmp/page
            echo "bytes=$(wc -c </tmp/page)"
            python -c 's=open("/tmp/page","r",encoding="utf-8",errors="replace").read(); i=s.find("SKILL.md"); j=s.find("self.__next_f.push"); print({"skill":i,"rsc":j,"dash":s.find("---"),"name":s.find("name:")}); print("AROUND_SKILL=",s[max(0,i-1000):i+5000]); print("AROUND_RSC=",s[max(0,j-500):j+7000])'
          done
