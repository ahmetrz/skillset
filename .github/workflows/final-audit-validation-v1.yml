name: Final audit validation gate v1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-audit-validation-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: gitskills-migration-run}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund @libsql/client
      - run: node scripts/final-audit-validation-v1.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-validation-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update final audit validation state"
          git push origin HEAD:gitskills-migration-run
