name: GitSkills downstream turbo
# keep the downstream drain inside one six-hour execution window

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/gitskills-downstream-turbo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitskills-downstream-turbo-v2
  cancel-in-progress: true

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1
  STATUS_URL: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1/gitskills-pipeline-status-v1

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4]
    steps:
      - name: Stream-drain analysis
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=2
          MIN_WIDTH=2
          MAX_WIDTH=4
          CLEAN=0
          BAD=0
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          for ((round=1; round<=3000; round++)); do
            round_width=$WIDTH
            for ((j=1;j<=round_width;j++)); do
              (
                body="$tmp/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-analysis-v1" || true)
                echo "$code" > "$tmp/$round-$j.code"
              ) &
            done
            wait || true
            bad=0; limited=0
            for ((j=1;j<=round_width;j++)); do
              code=$(cat "$tmp/$round-$j.code"); body=$(cat "$tmp/$round-$j.body" 2>/dev/null || true)
              if grep -q 'capacity_limited:' <<<"$body"; then limited=$((limited+1))
              elif [[ "$code" != 200 && "$code" != 201 ]] || grep -Eq '"ok"[[:space:]]*:[[:space:]]*false' <<<"$body"; then bad=$((bad+1)); fi
              rm -f "$tmp/$round-$j.code" "$tmp/$round-$j.body"
            done
            status='{}'
            if (( round % 10 == 0 )); then
              status=$(curl -sS --connect-timeout 5 --max-time 8 "$STATUS_URL" || echo '{}')
            fi
            terminal=$(jq -r '.analysis.terminal // 0' <<<"$status")
            open=$(jq -r '.analysis.open // 999999' <<<"$status")
            echo "analysis lane=${{ matrix.lane }} round=$round width=$WIDTH open=$open terminal=$terminal limited=$limited bad=$bad"
            (( terminal > 0 )) && { echo "analysis terminal errors" >&2; exit 1; }
            (( open == 0 )) && break
            if (( limited > 0 )); then
              CLEAN=0; BAD=0
              if (( WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-1)); fi
              sleep 1
              continue
            fi
            if (( bad == 0 )); then
              CLEAN=$((CLEAN+1)); BAD=0
              if (( CLEAN>=4 && WIDTH<MAX_WIDTH )); then WIDTH=$((WIDTH+2)); CLEAN=0; fi
              sleep 0.03
            else
              CLEAN=0; BAD=$((BAD+1))
              if (( bad*4>=round_width && WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-2)); ((WIDTH<MIN_WIDTH))&&WIDTH=$MIN_WIDTH; fi
              sleep $((BAD*2))
              (( BAD>=5 )) && { echo "analysis sustained failure" >&2; exit 1; }
            fi
          done

  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4]
    steps:
      - name: Stream-drain projection
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=4; MIN_WIDTH=4; MAX_WIDTH=6; CLEAN=0; BAD=0; tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          for ((round=1; round<=4000; round++)); do
            round_width=$WIDTH
            for ((j=1;j<=round_width;j++)); do
              (
                body="$tmp/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-projection-v1" || true)
                echo "$code" > "$tmp/$round-$j.code"
              ) &
            done
            wait || true
            bad=0; limited=0
            for ((j=1;j<=round_width;j++)); do
              code=$(cat "$tmp/$round-$j.code"); body=$(cat "$tmp/$round-$j.body" 2>/dev/null || true)
              if grep -q 'capacity_limited:' <<<"$body"; then limited=$((limited+1))
              elif [[ "$code" != 200 && "$code" != 201 ]] || grep -Eq '"ok"[[:space:]]*:[[:space:]]*false' <<<"$body"; then bad=$((bad+1)); fi
              rm -f "$tmp/$round-$j.code" "$tmp/$round-$j.body"
            done
            status='{}'
            if (( round % 10 == 0 )); then
              status=$(curl -sS --connect-timeout 5 --max-time 8 "$STATUS_URL" || echo '{}')
            fi
            a=$(jq -r '.analysis.open // 999999' <<<"$status"); p=$(jq -r '.projection.open // 999999' <<<"$status"); t=$(jq -r '.projection.terminal // 0' <<<"$status")
            echo "projection lane=${{ matrix.lane }} round=$round analysis_open=$a projection_open=$p terminal=$t limited=$limited bad=$bad"
            (( t > 0 )) && exit 1
            (( a == 0 && p == 0 )) && break
            if (( limited > 0 )); then
              CLEAN=0; BAD=0
              if (( WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-1)); fi
              sleep 1
              continue
            fi
            if (( bad == 0 )); then
              CLEAN=$((CLEAN+1)); BAD=0
              if (( CLEAN>=3 && WIDTH<MAX_WIDTH )); then WIDTH=$((WIDTH+2)); ((WIDTH>MAX_WIDTH))&&WIDTH=$MAX_WIDTH; CLEAN=0; fi
              sleep 0.03
            else
              CLEAN=0; BAD=$((BAD+1))
              if (( bad*4>=round_width && WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-2)); ((WIDTH<MIN_WIDTH))&&WIDTH=$MIN_WIDTH; fi
              sleep $((BAD*2))
            fi
            (( BAD>=5 )) && exit 1
          done

  rubric:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3]
    steps:
      - name: Stream-drain rubric
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=5; MIN_WIDTH=4; MAX_WIDTH=6; CLEAN=0; BAD=0; tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          for ((round=1; round<=4000; round++)); do
            round_width=$WIDTH
            for ((j=1;j<=round_width;j++)); do
              (
                body="$tmp/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-rubric-v1" || true)
                echo "$code" > "$tmp/$round-$j.code"
              ) &
            done
            wait || true
            bad=0; limited=0
            for ((j=1;j<=round_width;j++)); do
              code=$(cat "$tmp/$round-$j.code"); body=$(cat "$tmp/$round-$j.body" 2>/dev/null || true)
              if grep -q 'capacity_limited:' <<<"$body"; then limited=$((limited+1))
              elif [[ "$code" != 200 && "$code" != 201 ]] || grep -Eq '"ok"[[:space:]]*:[[:space:]]*false' <<<"$body"; then bad=$((bad+1)); fi
              rm -f "$tmp/$round-$j.code" "$tmp/$round-$j.body"
            done
            status='{}'
            if (( round % 10 == 0 )); then
              status=$(curl -sS --connect-timeout 5 --max-time 8 "$STATUS_URL" || echo '{}')
            fi
            a=$(jq -r '.analysis.open // 999999' <<<"$status"); p=$(jq -r '.projection.open // 999999' <<<"$status"); r=$(jq -r '.rubric.open // 999999' <<<"$status"); t=$(jq -r '.rubric.terminal // 0' <<<"$status")
            echo "rubric lane=${{ matrix.lane }} round=$round opens=$a/$p/$r terminal=$t limited=$limited bad=$bad"
            (( t > 0 )) && exit 1
            (( a == 0 && p == 0 && r == 0 )) && break
            if (( limited > 0 )); then
              CLEAN=0; BAD=0
              if (( WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-1)); fi
              sleep 1
              continue
            fi
            if (( bad == 0 )); then
              CLEAN=$((CLEAN+1)); BAD=0
              if (( CLEAN>=3 && WIDTH<MAX_WIDTH )); then WIDTH=$((WIDTH+2)); ((WIDTH>MAX_WIDTH))&&WIDTH=$MAX_WIDTH; CLEAN=0; fi
              sleep 0.03
            else
              CLEAN=0; BAD=$((BAD+1))
              if (( bad*4>=round_width && WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-2)); ((WIDTH<MIN_WIDTH))&&WIDTH=$MIN_WIDTH; fi
              sleep $((BAD*2))
            fi
            (( BAD>=5 )) && exit 1
          done

  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3]
    steps:
      - name: Stream-drain final
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=4; MIN_WIDTH=4; MAX_WIDTH=5; CLEAN=0; BAD=0; tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          for ((round=1; round<=4000; round++)); do
            round_width=$WIDTH
            for ((j=1;j<=round_width;j++)); do
              (
                body="$tmp/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-finalize-v1" || true)
                echo "$code" > "$tmp/$round-$j.code"
              ) &
            done
            wait || true
            bad=0; limited=0
            for ((j=1;j<=round_width;j++)); do
              code=$(cat "$tmp/$round-$j.code"); body=$(cat "$tmp/$round-$j.body" 2>/dev/null || true)
              if grep -q 'capacity_limited:' <<<"$body"; then limited=$((limited+1))
              elif [[ "$code" != 200 && "$code" != 201 ]] || grep -Eq '"ok"[[:space:]]*:[[:space:]]*false' <<<"$body"; then bad=$((bad+1)); fi
              rm -f "$tmp/$round-$j.code" "$tmp/$round-$j.body"
            done
            status='{}'
            if (( round % 10 == 0 )); then
              status=$(curl -sS --connect-timeout 5 --max-time 8 "$STATUS_URL" || echo '{}')
            fi
            a=$(jq -r '.analysis.open // 999999' <<<"$status"); p=$(jq -r '.projection.open // 999999' <<<"$status"); r=$(jq -r '.rubric.open // 999999' <<<"$status"); f=$(jq -r '.final.open // 999999' <<<"$status"); t=$(jq -r '.final.terminal // 0' <<<"$status")
            echo "final lane=${{ matrix.lane }} round=$round opens=$a/$p/$r/$f terminal=$t limited=$limited bad=$bad"
            (( t > 0 )) && exit 1
            (( a == 0 && p == 0 && r == 0 && f == 0 )) && break
            if (( limited > 0 )); then
              CLEAN=0; BAD=0
              if (( WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-1)); fi
              sleep 1
              continue
            fi
            if (( bad == 0 )); then
              CLEAN=$((CLEAN+1)); BAD=0
              if (( CLEAN>=4 && WIDTH<MAX_WIDTH )); then WIDTH=$((WIDTH+1)); CLEAN=0; fi
              sleep 0.03
            else
              CLEAN=0
              if (( bad*2>=round_width )); then BAD=$((BAD+1)); else BAD=0; fi
              if (( bad*2>=round_width && WIDTH>MIN_WIDTH )); then WIDTH=$((WIDTH-1)); fi
              sleep $((bad*2))
            fi
            (( BAD>=8 )) && exit 1
          done

  export:
    needs: [analysis, projection, rubric, final]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4]
    steps:
      - name: Drain canonical export
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=4; empty=0; bad=0; tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          for ((round=1; round<=160; round++)); do
            for ((j=1;j<=WIDTH;j++)); do
              (
                body="$tmp/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-canonical-export-v1" || true)
                echo "$code" > "$tmp/$round-$j.code"
              ) &
            done
            wait || true
            e=0; b=0
            for ((j=1;j<=WIDTH;j++)); do
              code=$(cat "$tmp/$round-$j.code"); body=$(cat "$tmp/$round-$j.body" 2>/dev/null||true)
              [[ "$code" == 200 || "$code" == 201 ]] || b=$((b+1))
              grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$body" && e=$((e+1))
              rm -f "$tmp/$round-$j.code" "$tmp/$round-$j.body"
            done
            (( e==WIDTH )) && empty=$((empty+1)) || empty=0
            (( empty>=3 )) && break
            (( b*2>=WIDTH )) && { bad=$((bad+1)); sleep $((bad*2)); } || { bad=0; sleep 0.05; }
            (( bad>=5 )) && exit 1
          done

  integrity-gate:
    needs: export
    runs-on: ubuntu-24.04
    steps:
      - name: Check completion gate
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -sS --connect-timeout 8 --max-time 30 -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-completion-check-v1")
          echo "$body"
          grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' <<<"$body" || exit 1
