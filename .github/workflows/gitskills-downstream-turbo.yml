name: GitSkills downstream turbo

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/gitskills-downstream-turbo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitskills-downstream-turbo-v1
  cancel-in-progress: true

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4]
    steps:
      - name: Drain analysis
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=4
          MAX_ROUNDS=2200
          empty_rounds=0
          bad_rounds=0
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          for ((round=1; round<=MAX_ROUNDS; round++)); do
            for ((j=1; j<=WIDTH; j++)); do
              (
                body="$tmpdir/$round-$j.body"
                code=$(curl -sS --connect-timeout 8 --max-time 55 -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/gitskills-analysis-v1" || true)
                printf '%s' "$code" > "$tmpdir/$round-$j.meta"
              ) &
            done
            wait || true
            empty=0; bad=0
            for ((j=1; j<=WIDTH; j++)); do
              code=$(cat "$tmpdir/$round-$j.meta")
              body=$(cat "$tmpdir/$round-$j.body" 2>/dev/null || true)
              echo "[analysis lane=${{ matrix.lane }} round=$round call=$j] HTTP $code ${body:0:260}"
              if [[ "$code" == 200 || "$code" == 201 ]]; then
                grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0' <<<"$body" && empty=$((empty+1))
              else
                bad=$((bad+1))
              fi
              rm -f "$tmpdir/$round-$j.meta" "$tmpdir/$round-$j.body"
            done
            if (( empty == WIDTH )); then empty_rounds=$((empty_rounds+1)); else empty_rounds=0; fi
            (( empty_rounds >= 3 )) && break
            if (( bad * 2 >= WIDTH )); then bad_rounds=$((bad_rounds+1)); sleep $((bad_rounds*2)); else bad_rounds=0; sleep 0.05; fi
            (( bad_rounds >= 5 )) && { echo "fail-closed: sustained analysis failures" >&2; exit 1; }
          done

  projection:
