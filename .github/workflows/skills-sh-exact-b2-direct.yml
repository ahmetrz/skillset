name: skills.sh exact B2 direct
# exact large-repo fallback and external-state reconciliation

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/skills-sh-exact-b2-direct.yml'
      - 'scripts/skills-sh-exact-b2-worker-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-exact-b2-direct-v1
  cancel-in-progress: false

jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        # Large repositories are capped at six aggregate archive operations.
        worker: [1,2]
    env:
      SUPABASE_URL: https://cxvvfgwdqgxczxmomztw.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-QoeR1QT-TcMoLNxrHmNNg_pniY7P7r
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      GITHUB_TOKEN: ${{ github.token }}
      SKILLS_SH_BATCH_SIZE: '8'
      SKILLS_SH_CONCURRENCY: '3'
      SKILLS_SH_MIN_CONCURRENCY: '2'
      SKILLS_SH_MAX_CONCURRENCY: '3'
      SKILLS_SH_MAX_BATCHES: '1000'
      SKILLS_SH_ARCHIVE_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @aws-sdk/client-s3@3 tar-stream@3
      - name: Reconcile external checkpoint
        if: matrix.worker == 1
        run: node scripts/skills-sh-exact-b2-worker-v1.mjs --reconcile
      - name: Direct exact acquisition worker ${{ matrix.worker }}
        run: node scripts/skills-sh-exact-b2-worker-v1.mjs
      - name: Print external exact checkpoint
        if: always()
        run: node scripts/skills-sh-exact-b2-worker-v1.mjs --status
