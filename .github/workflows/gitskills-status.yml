name: GitSkills status
# final integrity checkpoint

on:
  push:
    branches:
      - gitskills-migration-run
    paths:
      - '.github/workflows/gitskills-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitskills-status-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @aws-sdk/client-s3@3
      - name: Print live Turso checkpoint
        run: node scripts/gitskills-b2-worker-v2.mjs --status
      - name: Diagnose errors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@libsql/client';
          const c=createClient({url:process.env.TURSO_DATABASE_URL,authToken:process.env.TURSO_AUTH_TOKEN});
          const r=await c.execute(`SELECT status,attempts,substr(COALESCE(error,''),1,180) AS error,COUNT(*) AS n FROM gitskills_shards WHERE status='error' GROUP BY status,attempts,error ORDER BY n DESC LIMIT 20`);
          console.log(JSON.stringify({event:'diagnostic',rows:r.rows}));
          NODE
