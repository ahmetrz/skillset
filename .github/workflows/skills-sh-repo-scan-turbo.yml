name: skills.sh repo scan turbo
# retry sweep 2026-08-29

on:
  push:
    branches: [gitskills-migration-run]
    paths:
      - '.github/workflows/skills-sh-repo-scan-turbo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-repo-scan-turbo-v1
  cancel-in-progress: true

env:
  BASE: https://cxvvfgwdqgxczxmomztw.supabase.co/functions/v1

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        lane: [1,2,3,4]
    steps:
      - name: Drain repo scan queue with local fanout
        shell: bash
        run: |
          set -euo pipefail
          WIDTH=4
          MAX_ROUNDS=260
          empty_rounds=0
          bad_rounds=0
          total_success=0
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          call_one() {
            key="$1"
            body="$tmpdir/$key.body"
            meta="$tmpdir/$key.meta"
            code=$(curl -sS --connect-timeout 8 --max-time 50 -o "$body" -w '%{http_code}'               -X POST -H 'Content-Type: application/json' -d '{}'               "$BASE/skillset-skills-sh-repo-scan-v1" || true)
            printf '%s' "$code" > "$meta"
            return 0
          }

          for ((round=1; round<=MAX_ROUNDS; round++)); do
            keys=()
            for ((j=1; j<=WIDTH; j++)); do
              key="r$round-c$j"
              keys+=("$key")
              call_one "$key" &
            done
            wait

            empty=0
            bad=0
            for key in "${keys[@]}"; do
              code=$(cat "$tmpdir/$key.meta")
              text=$(cat "$tmpdir/$key.body" 2>/dev/null || true)
              echo "[lane=${{ matrix.lane }}][round=$round][$key] HTTP $code ${text:0:360}"
              if [[ "$code" == 200 || "$code" == 201 ]]; then
                if grep -Eq '"claimed"[[:space:]]*:[[:space:]]*0|"done"[[:space:]]*:[[:space:]]*true' <<<"$text"; then
                  empty=$((empty+1))
                else
                  total_success=$((total_success+1))
                fi
              else
                bad=$((bad+1))
              fi
              rm -f "$tmpdir/$key.meta" "$tmpdir/$key.body"
            done

            if (( empty == WIDTH )); then empty_rounds=$((empty_rounds+1)); else empty_rounds=0; fi
            (( empty_rounds >= 3 )) && break

            if (( bad * 2 >= WIDTH )); then
              bad_rounds=$((bad_rounds+1))
              sleep $((bad_rounds*3))
            else
              bad_rounds=0
              sleep 0.15
            fi
            if (( bad_rounds >= 4 )); then
              echo "fail-closed: sustained upstream failure ratio" >&2
              exit 1
            fi
          done

          echo "lane=${{ matrix.lane }} successes=$total_success"
